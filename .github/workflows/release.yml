name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          choco install nsis --no-progress -y
      - name: Build portable exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "ADB-Explorer" --hidden-import PyQt6.QtWidgets --hidden-import PyQt6.QtCore --hidden-import PyQt6.QtGui --hidden-import logging.handlers --add-data "assets;assets" --clean --log-level ERROR main.py
          Get-ChildItem dist -Recurse
          $exe = Get-ChildItem dist -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "PyInstaller did not produce an exe" }
          $target = Join-Path (Get-Location) "dist\ADB-Explorer.exe"
          if ($exe.FullName -ne $target) { Copy-Item $exe.FullName $target -Force }
          Copy-Item "dist\ADB-Explorer.exe" "dist\ADB-Explorer-portable.exe" -Force
      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = Get-Content VERSION
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DVERSION=$version packaging\nsis\installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ADB-Explorer-portable.exe
            dist/*setup.exe
      - name: Publish Windows assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ADB-Explorer-portable.exe
            dist/*setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Build deb and rpm
        run: bash packaging/linux/build-linux-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.rpm
      - name: Publish Linux assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
